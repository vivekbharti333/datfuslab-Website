<body>
<div class="page-wrap">
<div class="card">
<div class="card-header">
<div class="logo-ring">
<svg fill="none" viewbox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
<circle cx="20" cy="20" r="18" stroke="white" stroke-width="2"></circle>

</svg>

<h1>NGO CRM Registration</h1>
<p> User Registration</p>
</div>
<form class="form-body" id="registerForm" novalidate="">
<div class="form-row">
<div class="form-group">
<label for="firstName">First Name</label>
<input id="firstName" placeholder="Vivek" required="" type="text"/>
</div>
<div class="form-group">
<label for="lastName">Last Name</label>
<input id="lastName" placeholder="Bharti" required="" type="text"/>
</div>
</div>
<!-- Mobile + Send OTP -->
<div class="form-row">
<div class="form-group">
<label for="mobileNo">Mobile No.</label>
<div class="input-with-btn">
<input id="mobileNo" maxlength="10" placeholder="10-digit number" required="" type="tel"/>
<button class="btn-otp" id="sendOtpBtn" type="button">
<span class="otp-btn-text">Send OTP</span>
<span class="otp-spinner" id="otpSpinner"></span>
</button>
</div>
</div>
<div class="form-group">
<label for="alternateMobile">Alternate Mobile</label>
<input id="alternateMobile" placeholder="9999999999" type="tel"/>
</div>
</div>
<div class="form-group">
<label for="emailId">Email Address</label>
<input id="emailId" placeholder="vivek@example.com" required="" type="email"/>
</div>
<div class="form-row">
<div class="form-group">
<label for="password">Password</label>
<input id="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="form-group">
<label for="dob">Date of Birth</label>
<input id="dob" required="" type="date"/>
</div>
</div>
<!-- <div class="form-row">
          <div class="form-group">
            <label for="aadharNumber">Aadhaar Number</label>
            <input type="text" id="aadharNumber" placeholder="123412341234" maxlength="12" required />
          </div>
          <div class="form-group">
            <label for="panNumber">PAN Number</label>
            <input type="text" id="panNumber" placeholder="ABCDE1234F" maxlength="10" required />
          </div>
        </div> -->
<!-- OTP — disabled until Send OTP succeeds -->
<div class="form-group">
<label for="otp">
            OTP
            <span class="otp-hint" id="otpHint"></span>
</label>
<input disabled="" id="otp" maxlength="6" placeholder="Click 'Send OTP' first" required="" type="text"/>
</div>
<!-- Hidden fields -->
<input id="roleType" type="hidden" value="SUPERADMIN"/>
<input id="service" type="hidden" value="NGO_CRM"/>
<input id="createdBy" type="hidden" value="SYSTEM"/>
<input id="userPicture" type="hidden" value=""/>
<button class="btn-submit" disabled="" id="submitBtn" type="submit">
<span class="btn-text">Register</span>
<span class="btn-spinner" id="spinner"></span>
</button>
</form>
<!-- Response Message -->
<div class="response-msg" id="responseMsg" style="display:none">
<span class="msg-icon" id="msgIcon"></span>
<span class="msg-text" id="msgText"></span>
</div>
</div>
</div>
<script src="assets/js/wa_app.js"></script>
