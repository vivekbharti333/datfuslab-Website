<text x="584" y="414" text-anchor="end" fill="#172B3A" font-size="25" font-weight="700">₹10,000</text>
<circle cx="66" cy="468" r="20" fill="#E5EDF7"/>
<text x="66" y="476" text-anchor="middle" fill="#35547B" font-size="21" font-weight="700">PK</text>
<text x="101" y="477" fill="#293D4B" font-size="24">Priya Kapoor</text>
<text x="584" y="477" text-anchor="end" fill="#172B3A" font-size="25" font-weight="700">₹25,000</text>
