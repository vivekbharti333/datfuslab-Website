<text x="348" y="283" fill="#AC3E08" font-size="38" font-weight="700">₹18.75 lakh</text>
<text x="36" y="355" fill="#172B3A" font-size="25" font-weight="700">Recent donors</text>
<rect x="36" y="375" width="568" height="60" rx="12" fill="#F7F9FA"/>
<circle cx="66" cy="405" r="20" fill="#FFE8D9"/>
