<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1440" viewBox="0 0 640 720" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Donexia NGO CRM dashboard illustration</title>
<desc id="desc">A clear vector dashboard showing donor records, donations, a donation activity chart and an 80G receipt. All figures are illustrative sample data.</desc>
<defs><linearGradient id="canvas" x1="12" y1="12" x2="628" y2="708" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF8F2"/><stop offset="1" stop-color="#F0F5F7"/></linearGradient></defs>
<rect width="640" height="720" rx="32" fill="url(#canvas)"/>
<rect x="14" y="14" width="612" height="692" rx="24" fill="white" stroke="#DDE5E9" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="36" y="36" width="42" height="42" rx="12" fill="#D44A00"/>
<path d="M46 51c0-7 9-8 11-2 3-6 12-5 12 2 0 6-12 14-12 14S46 57 46 51Z" fill="white"/>
<text x="91" y="65" fill="#172B3A" font-size="29" font-weight="700">Donexia</text>
<circle cx="582" cy="57" r="20" fill="#F0F4F7"/>
<circle cx="582" cy="52" r="6" fill="#627588"/>
