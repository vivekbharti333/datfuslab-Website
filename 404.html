<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found | Datfuslab Technologies</title>
  <meta name="description" content="The requested page could not be found. Return to Datfuslab Technologies or explore our software and digital services.">
  <link rel="icon" href="/assets/img/favicon/favicon.ico">
  <style>
    :root {
      color-scheme: dark;
      --background: #111112;
      --surface: #1b1b1d;
      --text: #ffffff;
      --muted: #c4c4c8;
      --accent: #d84a05;
      --border: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 82% 18%, rgba(216, 74, 5, 0.28), transparent 28rem),
        var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a { color: inherit; }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0;
    }

    .logo img {
      display: block;
      width: 300px;
      height: auto;
    }

    .header-link {
      padding: 12px 20px;
      border: 1px solid var(--border);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
    }

    main {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 100px);
      padding: 44px 20px 80px;
    }

    .error-card {
      width: min(760px, 100%);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: rgba(27, 27, 29, 0.92);
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.32);
    }

    .error-code {
      margin: 0;
      color: var(--accent);
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 0.85;
      letter-spacing: -0.07em;
    }

    h1 {
      margin: 28px 0 14px;
      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: 1.05;
    }

    .description {
      max-width: 580px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 22px;
      border: 1px solid var(--border);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
    }

    .button-primary {
      border-color: var(--accent);
      background: var(--accent);
    }

    .help-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 20px;
      margin-top: 28px;
      padding: 0;
      list-style: none;
      color: var(--muted);
    }

    .help-links a:hover,
    .header-link:hover { color: #ff7a38; }

    @media (max-width: 520px) {
      .site-header { width: min(100% - 28px, 1180px); }
      .logo img { width: 220px; }
      .header-link { display: none; }
      main { padding-top: 24px; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/" aria-label="Datfuslab Technologies homepage">
      <img src="assets/img/logo/logo-white.webp" width="550" height="150" alt="Datfuslab Technologies">
    </a>
    <a class="header-link" href="/contact">Contact us</a>
  </header>

  <main>
    <section class="error-card" aria-labelledby="page-title">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 id="page-title">Page not found</h1>
      <p class="description">The page may have moved, been removed, or the address may be incorrect. Use one of the links below to continue.</p>

      <div class="actions">
        <a class="button button-primary" href="index.html">Return to homepage</a>
        <a class="button" href="contact.html">Contact Datfuslab</a>
      </div>

      <ul class="help-links" aria-label="Popular pages">
        <li><a href="/software-development">Software development</a></li>
        <li><a href="/website-design">Website design</a></li>
        <li><a href="/mobile-app-development">Mobile apps</a></li>
        <li><a href="/ngo-crm-software">Donexia NGO CRM</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
